<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 330" font-family="Inter, Helvetica, Arial, sans-serif" font-size="15"><defs><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#33291f"/></marker><marker id="av" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#c15b38"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#7a5aa8"/></marker><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9a8c70"/></marker></defs><rect width="660" height="330" fill="#fbf8f0"/><line x1="120.0" y1="300.0" x2="587.5" y2="300.0" stroke="#9a8c70" stroke-width="1"/><line x1="150.0" y1="300.0" x2="587.5" y2="157.9" stroke="#33291f" stroke-width="1.6"/><path d="M200.0,300.0 A50,50 0 0,0 197.6,284.5" fill="none" stroke="#9a8c70" stroke-width="1.2"/><polygon points="364.0,230.5 468.6,196.5 456.2,158.4 351.6,192.4" fill="#efe6d2" stroke="#33291f" stroke-width="1.4"/><circle cx="383.7" cy="223.0" r="0" /><circle cx="448.3" cy="202.0" r="0" /><line x1="410.1" y1="194.5" x2="410.1" y2="309.5" stroke="#33291f" stroke-width="2" marker-end="url(#ak)"/><text x="432.1" y="302.5" fill="#33291f" font-size="17" text-anchor="middle"><tspan font-style="italic">W</tspan></text><line x1="410.1" y1="194.5" x2="369.9" y2="70.8" stroke="#33291f" stroke-width="2" marker-end="url(#ak)"/><text x="355.9" y="62.8" fill="#33291f" font-size="17" text-anchor="middle"><tspan font-style="italic">N</tspan></text><line x1="410.1" y1="194.5" x2="324.5" y2="222.3" stroke="#33291f" stroke-width="2" marker-end="url(#ak)"/><text x="308.5" y="212.3" fill="#33291f" font-size="17" text-anchor="middle"><tspan font-style="italic">F</tspan><tspan font-size="11" dy="4">f</tspan></text><circle cx="410.1" cy="194.5" r="3.5" fill="#33291f"/><line x1="130.0" y1="60.0" x2="40.0" y2="60.0" stroke="#7a5aa8" stroke-width="2" marker-end="url(#aa)"/><text x="140.0" y="65.0" fill="#7a5aa8" font-size="14" text-anchor="start">to the centre of the bend</text><text x="640.0" y="100.0" fill="#6b5d43" font-size="13" text-anchor="end" font-style="italic">maximum speed: the car tends to slide</text><text x="640.0" y="118.0" fill="#6b5d43" font-size="13" text-anchor="end" font-style="italic">UP the bank, so friction acts DOWN it</text></svg>