<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 270" font-family="Inter, Helvetica, Arial, sans-serif" font-size="15" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#d9a032"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#3d6bb3"/></marker></defs><rect width="600" height="270" fill="#fbf8f0"/>
<path d="M80 200 C120 60 250 50 290 130 S 420 250 500 120" fill="none" stroke="#d9a032" stroke-width="2.4" marker-end="url(#am)"/>
<line x1="80" y1="200" x2="497" y2="122" stroke="#3d6bb3" stroke-width="2.4" marker-end="url(#ab)"/>
<circle cx="80" cy="200" r="5" fill="#33291f"/><text x="80" y="228" fill="#33291f" text-anchor="middle" font-weight="600" font-size="13">start</text>
<circle cx="500" cy="120" r="5" fill="#33291f"/><text x="514" y="116" fill="#33291f" text-anchor="start" font-weight="600" font-size="13">finish</text>
<text x="180" y="30" fill="#b07f1c" font-weight="700" font-size="16" text-anchor="middle">S — length of the path</text>
<text x="180" y="50" fill="#b07f1c" font-size="13" text-anchor="middle">only adds up, no direction</text>
<text x="330" y="236" fill="#3d6bb3" font-weight="700" font-size="16" text-anchor="middle">S<tspan baseline-shift="sub" font-size="11">x</tspan> — start → finish, straight</text>
<text x="330" y="256" fill="#3d6bb3" font-size="13" text-anchor="middle">has direction</text></svg>